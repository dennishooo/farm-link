<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2f7d3c" />
<title>FarmLink v2.8</title>
<style>
:root{--bg:#f4f7ef;--card:rgba(255,255,255,.94);--text:#203022;--muted:#667366;--green:#2f7d3c;--dark:#223426;--red:#b94a48;--gold:#d39b2a;--border:#dce8d6;--soil:#b9824a;--pasture:#bde3a0;--shadow:0 16px 40px rgba(32,48,34,.12)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--text);background:radial-gradient(circle at top,#e4f4d8,var(--bg));min-height:100vh}.app{width:min(1220px,100%);margin:0 auto;padding:14px}.hero{margin:8px 0 14px}.eyebrow{color:var(--green);font-weight:900;margin:0 0 6px}h1{font-size:clamp(38px,9vw,72px);letter-spacing:-.06em;margin:0;line-height:.95}h2{margin:0 0 12px}.subtitle{color:var(--muted);margin:7px 0 0;line-height:1.45}.card{background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:15px;margin-bottom:13px;backdrop-filter:blur(10px)}label{display:grid;gap:8px;color:var(--muted);font-weight:800;margin-bottom:12px}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:14px;padding:13px 14px;font-size:16px;background:#fbfff8;color:var(--text)}button{appearance:none;border:0;border-radius:16px;padding:12px;background:var(--green);color:white;font-size:14px;font-weight:900;cursor:pointer;width:100%;touch-action:manipulation}button:disabled{opacity:.42}.secondary{background:var(--dark)}.ghost{background:#edf4e9;color:var(--green)}.danger{background:var(--red)}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.topbar .tools{display:flex;gap:8px;flex-wrap:wrap}.topbar button{width:auto}.statbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.stat{background:#f5faef;border:1px solid var(--border);border-radius:12px;padding:8px 10px;font-weight:800}.layout{display:grid;grid-template-columns:1fr 1.05fr;gap:13px}.playerGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-top:10px}.player{border:1px solid var(--border);border-radius:18px;background:#fbfff8;padding:12px}.player.current{border-color:var(--green);box-shadow:inset 0 0 0 2px rgba(47,125,60,.2)}.player.winner{border-color:var(--gold);box-shadow:inset 0 0 0 2px rgba(211,155,42,.25)}.player h3{margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}.res{font-size:13px;line-height:1.55;color:var(--muted)}.farm{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:9px}.tile{aspect-ratio:1;border-radius:13px;border:2px solid rgba(32,48,34,.08);display:grid;place-items:center;text-align:center;font-size:22px;font-weight:900;overflow:hidden}.tile small{display:block;font-size:9px;font-weight:900;color:rgba(32,48,34,.74);margin-top:1px}.empty{background:#edf4e9}.field{background:linear-gradient(135deg,#c48a4a,var(--soil));color:white}.roomWood{background:linear-gradient(135deg,#d7ac75,#c58b4d)}.roomClay{background:linear-gradient(135deg,#c98974,#9c5a49);color:white}.roomStone{background:linear-gradient(135deg,#b8bec5,#767f88);color:white}.pasture{background:linear-gradient(135deg,#d8f3bd,var(--pasture))}.stable{box-shadow:inset 0 0 0 5px #8a5a2b;background:#dff0c8}.actionBoard{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.action{border:1px solid var(--border);border-radius:18px;background:#fbfff8;padding:10px}.action.used{opacity:.55;background:#f1f1ed}.action.locked{opacity:.45}.emoji{font-size:25px}.badge{display:inline-flex;border-radius:999px;background:#edf4e9;color:var(--green);padding:5px 8px;font-size:12px;font-weight:900;margin-top:6px}.usedBy{color:var(--red);font-weight:900;font-size:12px}.cards{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.miniCard{border:1px solid var(--border);background:white;border-radius:12px;padding:6px 8px;font-size:12px;color:var(--muted)}.scoreline{display:flex;justify-content:space-between;border-bottom:1px dashed var(--border);padding:5px 0}.modal{position:fixed;inset:0;background:rgba(0,0,0,.36);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}.modal.show{display:flex}.modalBox{background:white;border-radius:24px;box-shadow:var(--shadow);padding:18px;width:min(620px,100%);max-height:82vh;overflow:auto}#log{margin:0;padding-left:20px;color:var(--muted)}#log li{margin:6px 0;line-height:1.4}.rules{color:var(--muted);line-height:1.55}.footer-note{font-size:13px;color:var(--muted);text-align:center;margin:12px 0 4px}@media(max-width:860px){.layout{grid-template-columns:1fr}.actionBoard{grid-template-columns:1fr}.topbar{display:block}.topbar button{width:100%;margin-bottom:8px}.topbar .tools{display:grid;grid-template-columns:1fr 1fr}.farm{gap:5px}.tile{font-size:19px}}
</style>
</head>
<body>
<main class="app">
<header class="hero"><p class="eyebrow">v2.8 單檔版：修正手牌選擇、工人放置、卡牌 Lite</p><h1>FarmLink</h1><p class="subtitle">簡化農場桌遊原型：3x5 農場、公共行動板、收成摘要、設定、存檔碼。</p></header>
<section id="setup" class="card"><h2>建立遊戲</h2><label>玩家人數<select id="playerCount"><option value="1">1 人</option><option value="2">2 人</option><option value="3">3 人</option><option value="4" selected>4 人</option></select></label><label>遊戲長度<select id="maxRounds"><option value="7">7 輪快局</option><option value="10">10 輪中局</option><option value="14" selected>14 輪完整局</option></select></label><label>卡牌 Lite<select id="cardsOn"><option value="1" selected>開啟</option><option value="0">關閉</option></select></label><div id="nameFields"></div><button id="startBtn">開始遊戲</button></section>
<section id="game" class="card" hidden><div class="topbar"><div><p class="eyebrow">第 <span id="round">1</span> / <span id="roundMax">14</span> 輪</p><h2 id="turnTitle">玩家回合</h2><div class="statbar"><span class="stat">剩餘工人：<span id="workersLeft">0</span></span><span class="stat">起始玩家：<span id="startPlayer">-</span></span><span class="stat">收成輪：<span id="harvestRounds">-</span></span></div></div><div class="tools"><button id="exportBtn" class="ghost">匯出</button><button id="importBtn" class="ghost">匯入</button><button id="newGameBtn" class="danger">新遊戲</button></div></div><div class="layout"><section><h2>玩家農場 3x5</h2><div id="players" class="playerGrid"></div></section><section><h2>公共行動板</h2><div id="actionBoard" class="actionBoard"></div></section></div></section>
<section id="scoreCard" class="card" hidden><h2>遊戲結束</h2><div id="winnerBox"></div><button id="restartBtn" class="danger">重新開始</button></section>
<section class="card"><h2>事件紀錄</h2><ul id="log"></ul></section>
<section class="card rules"><h2>v2.7 新增</h2><p>行動格資源會每輪累積；動物需要牧場或馬廄容量；播種可選穀物或蔬菜；收成會用摘要彈窗顯示；卡牌 Lite 提供簡單能力；可匯出 / 匯入存檔碼。</p></section>
<p class="footer-note">單檔 HTML，進度儲存在本機瀏覽器 localStorage。</p>
</main>
<div id="modal" class="modal"><div class="modalBox"><h2 id="modalTitle"></h2><div id="modalBody"></div><button id="modalClose" class="secondary">關閉</button></div></div>
<script>
const $=s=>document.querySelector(s);const setupEl=$('#setup'),gameEl=$('#game'),scoreCard=$('#scoreCard'),playerCountEl=$('#playerCount'),maxRoundsEl=$('#maxRounds'),cardsOnEl=$('#cardsOn'),nameFieldsEl=$('#nameFields'),startBtn=$('#startBtn'),newGameBtn=$('#newGameBtn'),restartBtn=$('#restartBtn'),exportBtn=$('#exportBtn'),importBtn=$('#importBtn'),roundEl=$('#round'),roundMaxEl=$('#roundMax'),turnTitleEl=$('#turnTitle'),workersLeftEl=$('#workersLeft'),startPlayerEl=$('#startPlayer'),harvestRoundsEl=$('#harvestRounds'),playersEl=$('#players'),actionBoardEl=$('#actionBoard'),logEl=$('#log'),winnerBox=$('#winnerBox'),modal=$('#modal'),modalTitle=$('#modalTitle'),modalBody=$('#modalBody'),modalClose=$('#modalClose');
const cardDeck=[{id:'lumberjack',type:'occ',name:'伐木工',txt:'取木材額外 +1'},{id:'fisher',type:'occ',name:'漁夫',txt:'取食物額外 +1'},{id:'shepherd',type:'occ',name:'牧羊人',txt:'取羊額外 +1'},{id:'mason',type:'occ',name:'泥石匠',txt:'翻修少付 1 對應材料'},{id:'oven',type:'imp',name:'烤爐',txt:'收成時每 1 穀物可換 2 食物'},{id:'garden',type:'imp',name:'菜園',txt:'播種蔬菜時額外 +1 蔬菜在田'},{id:'store',type:'imp',name:'小倉庫',txt:'完場每 3 木材 +1 分'},{id:'cheapFence',type:'imp',name:'簡易柵欄',txt:'第一次蓋牧場少付 1 木材'}];
const actions=[['wood','🪵','取木材','拿走格上木材',1,true],['clay','🧱','取黏土','拿走格上黏土',1,true],['reed','🌿','取蘆葦','拿走格上蘆葦',1,true],['food','🍲','釣魚','拿走格上食物',1,true],['grain','🌾','取穀物','取得 1 穀物',1,false],['plow','🚜','開墾田地','空地變田地',1,false],['sow','🌱','播種','選穀物或蔬菜',1,false],['fence','𐂷','蓋牧場','空地變牧場',1,false],['stable','🐴','建馬廄','空地變馬廄',2,false],['sheep','🐑','取羊','拿走格上羊',2,true],['renovateClay','🏚️','翻修泥屋','木屋變泥屋',3,false],['buildRoom','🏠','擴建房間','需木材和蘆葦',4,false],['family','👨‍👩‍👧','家庭成長','需空房間',5,false],['boar','🐗','取野豬','拿走格上野豬',6,true],['vegetable','🥕','取蔬菜','取得 1 蔬菜',7,false],['stone','🪨','取石頭','拿走格上石頭',8,true],['cattle','🐄','取牛','拿走格上牛',9,true],['renovateStone','🏛️','翻修石屋','泥屋變石屋',10,false],['playOcc','🎓','打出職業','打出 1 張職業卡',1,false],['playImp','🃏','打出小發展','打出 1 張小發展',1,false],['start','⭐','成為起始玩家','下輪先手，+1 食物',1,false]];
let state=load()||fresh();
function fresh(){return{v:'2.8',hasStarted:false,hasEnded:false,round:1,maxRounds:14,harvest:[4,7,9,11,13,14],cardsOn:true,currentPlayerIndex:0,startPlayerIndex:0,occupied:{},pools:{wood:0,clay:0,reed:0,food:0,sheep:0,boar:0,cattle:0,stone:0},players:[],log:[]}}
function createNameFields(){let c=Number(playerCountEl.value);nameFieldsEl.innerHTML='';for(let i=0;i<c;i++){let l=document.createElement('label');l.innerHTML=`玩家 ${i+1} 名稱 <input class="playerName" maxlength="16" value="玩家${i+1}" />`;nameFieldsEl.appendChild(l)}}
function makeFarm(){return Array.from({length:15},(_,i)=>i<2?{type:'room',house:'wood'}:{type:'empty'})}function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}function deal(){return [...cardDeck].sort(()=>Math.random()-.5).slice(0,6)}
function startGame(){state=fresh();state.maxRounds=Number(maxRoundsEl.value);state.harvest=state.maxRounds===7?[3,5,7]:state.maxRounds===10?[4,7,9,10]:[4,7,9,11,13,14];state.cardsOn=cardsOnEl.value==='1';let names=[...document.querySelectorAll('.playerName')].map(i=>i.value.trim()||'玩家').slice(0,4);state.players=names.map(name=>({id:uid(),name,wood:3,clay:0,reed:1,stone:0,grain:1,veg:0,food:2,sheep:0,boar:0,cattle:0,family:2,workersUsed:0,begging:0,house:'wood',score:0,detail:{},farm:makeFarm(),hand:state.cardsOn?deal():[],played:[],flags:{cheapFenceUsed:false}}));state.hasStarted=true;state.log=['遊戲開始'];newRoundPools();save();render()}
function current(){return state.players[state.currentPlayerIndex]}function workersLeft(p=current()){return Math.max(0,p.family-p.workersUsed)}function has(p,id){return p.played.some(c=>c.id===id)}function aDef(id){return actions.find(a=>a[0]===id)}function available(){return actions.filter(a=>state.cardsOn||!['playOcc','playImp'].includes(a[0]))}
function newRoundPools(){state.pools.wood+=3;state.pools.clay+=2;state.pools.reed+=1;state.pools.food+=1;state.pools.sheep+=state.round>=2?1:0;state.pools.boar+=state.round>=6?1:0;state.pools.cattle+=state.round>=9?1:0;state.pools.stone+=state.round>=8?2:0}
function nextPlayer(){let loops=0;do{state.currentPlayerIndex=(state.currentPlayerIndex+1)%state.players.length;loops++}while(workersLeft(current())<=0&&loops<=state.players.length);if(state.players.every(p=>workersLeft(p)<=0))endWorkPhase()}
function endWorkPhase(){log(`第 ${state.round} 輪行動結束`);if(state.harvest.includes(state.round))harvest();if(state.round>=state.maxRounds){endGame();return}state.round++;state.occupied={};state.players.forEach(p=>p.workersUsed=0);state.currentPlayerIndex=state.startPlayerIndex;newRoundPools();log(`進入第 ${state.round} 輪，資源累積`)}
function useWorker(id){let def=aDef(id);if(!def||def[4]>state.round)return;if(state.occupied[id])return log('此行動格已被佔用');let p=current();if(workersLeft(p)<=0)return;if((id==='playOcc'||id==='playImp')&&state.cardsOn){chooseCardAction(id,p);return}let ok=apply(p,id);if(ok){state.occupied[id]=p.name;p.workersUsed++;if(state.players.every(x=>workersLeft(x)<=0))endWorkPhase();else nextPlayer()}save();render()}
function emptyIndex(p){return p.farm.findIndex(t=>t.type==='empty')}function fieldIndex(p){return p.farm.findIndex(t=>t.type==='field'&&!t.crop)}function animalTiles(p,type){return p.farm.filter(t=>(t.type==='pasture'||t.type==='stable')&&(!t.animal||t.animal===type))}function capTile(t){return t.type==='stable'?1:2}function totalAnimals(p){return p.sheep+p.boar+p.cattle}function addAnimal(p,type,n=1){for(let k=0;k<n;k++){let placed=false;for(const t of animalTiles(p,type)){t.count=t.count||0;if(t.count<capTile(t)){t.animal=type;t.count++;p[type]++;placed=true;break}}if(!placed)return false}return true}
function takePool(p,id){let n=state.pools[id]||0;if(n<=0)return fail('此格暫時沒有資源');state.pools[id]=0;if(['sheep','boar','cattle'].includes(id)){if(!addAnimal(p,id,n)){state.pools[id]=n;return fail(`${p.name} 容量不足，不能拿全部動物`)}}else{p[id]+=n;if(id==='wood'&&has(p,'lumberjack'))p.wood++;if(id==='food'&&has(p,'fisher'))p.food++}log(`${p.name} 拿走 ${n} ${nameOf(id)}`);return true}
function apply(p,id){if(['wood','clay','reed','food','sheep','boar','cattle','stone'].includes(id))return takePool(p,id);switch(id){case'grain':p.grain++;log(`${p.name} 取得 1 穀物`);return true;case'vegetable':p.veg++;log(`${p.name} 取得 1 蔬菜`);return true;case'plow':{let i=emptyIndex(p);if(i<0)return fail('沒有空地');p.farm[i]={type:'field'};log(`${p.name} 開墾田地`);return true}case'sow':return sow(p);case'fence':{let cost=has(p,'cheapFence')&&!p.flags.cheapFenceUsed?1:2;if(p.wood<cost)return fail(`木材不足，需要 ${cost}`);let i=emptyIndex(p);if(i<0)return fail('沒有空地');p.wood-=cost;p.flags.cheapFenceUsed=true;p.farm[i]={type:'pasture'};log(`${p.name} 蓋牧場`);return true}case'stable':{if(p.wood<2)return fail('馬廄需要 2 木材');let i=emptyIndex(p);if(i<0)return fail('沒有空地');p.wood-=2;p.farm[i]={type:'stable'};log(`${p.name} 建馬廄`);return true}case'buildRoom':{if(p.wood<5||p.reed<2)return fail('擴建需要 5 木材 + 2 蘆葦');let i=emptyIndex(p);if(i<0)return fail('沒有空地');p.wood-=5;p.reed-=2;p.farm[i]={type:'room',house:p.house};log(`${p.name} 擴建房間`);return true}case'family':{let rooms=p.farm.filter(t=>t.type==='room').length;if(p.family>=rooms)return fail('沒有空房間');p.family++;log(`${p.name} 增加家庭成員`);return true}case'renovateClay':return renovate(p,'wood','clay');case'renovateStone':return renovate(p,'clay','stone');case'playOcc':return playCard(p,'occ');case'playImp':return playCard(p,'imp');case'start':state.startPlayerIndex=state.players.indexOf(p);p.food++;log(`${p.name} 成為下輪起始玩家`);return true}return false}
function sow(p){let choices=[];if(p.grain>0)choices.push('grain');if(p.veg>0)choices.push('veg');let idx=fieldIndex(p);if(idx<0)return fail('沒有空田');if(!choices.length)return fail('沒有種子');let pick=choices.length===1?choices[0]:prompt('輸入 grain 種穀物，或 veg 種蔬菜','grain');if(!choices.includes(pick))return fail('取消播種');if(pick==='grain'){p.grain--;p.farm[idx].crop='grain';p.farm[idx].count=3}else{p.veg--;p.farm[idx].crop='veg';p.farm[idx].count=has(p,'garden')?3:2}log(`${p.name} 播種${pick==='grain'?'穀物':'蔬菜'}`);return true}
function renovate(p,from,to){if(p.house!==from)return fail('房屋類型不符合');let rooms=p.farm.filter(t=>t.type==='room').length,mat=to==='clay'?'clay':'stone',cost=Math.max(0,rooms-(has(p,'mason')?1:0));if(p[mat]<cost||p.reed<1)return fail(`翻修需要 ${cost} ${nameOf(mat)} + 1 蘆葦`);p[mat]-=cost;p.reed--;p.house=to;p.farm.forEach(t=>{if(t.type==='room')t.house=to});log(`${p.name} 翻修成${to==='clay'?'泥屋':'石屋'}`);return true}
function playCard(p,type){let cards=p.hand.filter(c=>c.type===type);if(!cards.length)return fail('沒有可打出的卡');let msg=cards.map((c,i)=>`${i+1}. ${c.name}：${c.txt}`).join('\n');let n=Number(prompt('選擇卡牌：\n'+msg,'1'))-1;if(!cards[n])return fail('取消打牌');let card=cards[n];p.hand=p.hand.filter(c=>c.id!==card.id);p.played.push(card);log(`${p.name} 打出 ${card.name}`);return true}
function chooseCardAction(actionId,p){let type=actionId==='playOcc'?'occ':'imp';let cards=p.hand.filter(c=>c.type===type);if(!cards.length){log(type==='occ'?'沒有職業卡可打出':'沒有小發展卡可打出');save();render();return}modalTitle.textContent=type==='occ'?'選擇要打出的職業卡':'選擇要打出的小發展';modalBody.innerHTML=cards.map(c=>`<div class="miniCard" style="display:block;margin:8px 0;padding:10px"><strong>${escape(c.name)}</strong><br>${escape(c.txt)}<button style="margin-top:8px" data-card="${c.id}">打出這張</button></div>`).join('');modal.classList.add('show');document.querySelectorAll('[data-card]').forEach(b=>b.addEventListener('click',()=>finishCardAction(actionId,b.dataset.card)))}
function finishCardAction(actionId,cardId){modal.classList.remove('show');let p=current();if(state.occupied[actionId]||workersLeft(p)<=0)return;let card=p.hand.find(c=>c.id===cardId);if(!card){log('找不到這張卡');save();render();return}p.hand=p.hand.filter(c=>c.id!==card.id);p.played.push(card);log(`${p.name} 打出 ${card.name}`);state.occupied[actionId]=p.name;p.workersUsed++;if(state.players.every(x=>workersLeft(x)<=0))endWorkPhase();else nextPlayer();save();render()}
function harvest(){let rows=['收成階段開始'];for(const p of state.players){let gain=[];for(const t of p.farm){if(t.type==='field'&&t.crop&&t.count>0){t.count--;if(t.crop==='grain'){p.grain++;gain.push('+1 穀物')}else{p.veg++;gain.push('+1 蔬菜')}if(t.count<=0){delete t.crop;delete t.count}}}if(has(p,'oven')&&p.grain>0){let use=Math.min(p.grain,p.family);p.grain-=use;p.food+=use*2;gain.push(`烤爐 ${use} 穀物換 ${use*2} 食物`)}let need=p.family*2;if(p.food>=need){p.food-=need;gain.push(`餵食 -${need}`)}else{let lack=need-p.food;p.food=0;p.begging+=lack;gain.push(`食物不足，乞討 +${lack}`)}breed(p,'sheep',gain);breed(p,'boar',gain);breed(p,'cattle',gain);rows.push(`<strong>${escape(p.name)}</strong>：${gain.join('，')||'無變化'}`)}showModal('收成摘要',rows.map(x=>`<p>${x}</p>`).join(''));log('完成收成')}
function breed(p,type,gain){if(p[type]>=2&&addAnimal(p,type,1))gain.push(`${nameOf(type)}繁殖 +1`)}
function scoreTable(n,arr){for(const [limit,pts] of arr){if(n<=limit)return pts}return arr.at(-1)[1]}function calc(p){let fields=p.farm.filter(t=>t.type==='field').length,past=p.farm.filter(t=>t.type==='pasture').length,stables=p.farm.filter(t=>t.type==='stable').length,unused=p.farm.filter(t=>t.type==='empty').length,rooms=p.farm.filter(t=>t.type==='room').length;let d={田地:scoreTable(fields,[[1,-1],[2,1],[3,2],[4,3],[99,4]]),牧場:scoreTable(past,[[0,-1],[1,1],[2,2],[3,3],[99,4]]),穀物:scoreTable(p.grain,[[0,-1],[3,1],[5,2],[7,3],[99,4]]),蔬菜:scoreTable(p.veg,[[0,-1],[1,1],[2,2],[3,3],[99,4]]),羊:scoreTable(p.sheep,[[0,-1],[3,1],[5,2],[7,3],[99,4]]),野豬:scoreTable(p.boar,[[0,-1],[2,1],[4,2],[6,3],[99,4]]),牛:scoreTable(p.cattle,[[0,-1],[1,1],[3,2],[5,3],[99,4]]),馬廄:stables,未使用格:-unused,房屋:p.house==='stone'?rooms*2:p.house==='clay'?rooms:0,家庭成員:p.family*3,乞討卡:-p.begging*3,卡牌:cardScore(p)};p.detail=d;p.score=Object.values(d).reduce((a,b)=>a+b,0)}
function cardScore(p){let s=p.played.length;if(has(p,'store'))s+=Math.floor(p.wood/3);return s}function endGame(){state.hasEnded=true;state.hasStarted=false;state.players.forEach(calc);state.players.sort((a,b)=>b.score-a.score);log(`遊戲結束，${state.players[0].name} 勝出`)}
function nameOf(id){return {wood:'木材',clay:'黏土',reed:'蘆葦',food:'食物',sheep:'羊',boar:'野豬',cattle:'牛',stone:'石頭',grain:'穀物',veg:'蔬菜'}[id]||id}function fail(m){log(m);return false}function log(m){state.log.push(m)}
function tile(t){let icon='⬜',label='空地',cls='empty';if(t.type==='room'){icon=t.house==='stone'?'🪨':t.house==='clay'?'🧱':'🏠';label=t.house==='stone'?'石屋':t.house==='clay'?'泥屋':'木屋';cls='room'+cap(t.house)}else if(t.type==='field'){icon=t.crop==='veg'?'🥕':'🌾';label=t.crop?nameOf(t.crop)+'x'+t.count:'田地';cls='field'}else if(t.type==='pasture'||t.type==='stable'){icon=t.animal==='cattle'?'🐄':t.animal==='boar'?'🐗':t.animal==='sheep'?'🐑':t.type==='stable'?'🐴':'🐑';label=t.animal?nameOf(t.animal)+'x'+(t.count||0):(t.type==='stable'?'馬廄':'牧場');cls=t.type==='stable'?'stable':'pasture'}return`<div class="tile ${cls}"><div>${icon}<small>${label}</small></div></div>`}function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function playerHtml(p,i){let cur=state.hasStarted&&i===state.currentPlayerIndex,win=state.hasEnded&&i===0;return`<article class="player ${cur?'current':''} ${win?'winner':''}"><h3><span>${escape(p.name)} ${cur?'🌱':''} ${win?'🏆':''}</span><span>${p.score||0}分</span></h3><div class="res">木${p.wood} 黏${p.clay} 蘆${p.reed} 石${p.stone}｜穀${p.grain} 蔬${p.veg} 食${p.food}<br>羊${p.sheep} 豬${p.boar} 牛${p.cattle}｜家庭${p.family} 工人${p.workersUsed}/${p.family}｜乞討${p.begging}</div><div class="farm">${p.farm.map(tile).join('')}</div>${state.cardsOn?`<div class="cards"><span class="miniCard">手牌 ${p.hand.length}</span>${p.hand.map(c=>`<span class="miniCard">手:${escape(c.name)}</span>`).join('')}${p.played.map(c=>`<span class="miniCard">已出:${escape(c.name)}</span>`).join('')}</div>`:''}</article>`}
function renderActions(){actionBoardEl.innerHTML=available().map(a=>{let [id,em,n,d,from,acc]=a,used=state.occupied[id],locked=from>state.round,pool=acc?`<span class="badge">累積：${state.pools[id]||0}</span>`:`<span class="badge">第 ${from} 輪起</span>`;return`<div class="action ${used?'used':''} ${locked?'locked':''}"><div class="emoji">${em}</div><strong>${n}</strong><p class="subtitle">${locked?'未解鎖：第 '+from+' 輪開放':d}</p>${used?`<div class="usedBy">已被 ${escape(used)} 佔用</div>`:pool}<button ${used||locked?'disabled':''} data-action="${id}">${locked?'未解鎖':used?'已佔用':'選擇'}</button></div>`}).join('');document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>useWorker(b.dataset.action)))}
function renderScore(){if(!state.hasEnded){winnerBox.innerHTML='';return}winnerBox.innerHTML=state.players.map((p,i)=>`<article class="player ${i===0?'winner':''}"><h3>${i+1}. ${escape(p.name)} <span>${p.score}分</span></h3>${Object.entries(p.detail).map(([k,v])=>`<div class="scoreline"><span>${k}</span><strong>${v}</strong></div>`).join('')}</article>`).join('')}
function render(){setupEl.hidden=state.hasStarted||state.hasEnded;gameEl.hidden=!state.hasStarted;scoreCard.hidden=!state.hasEnded;if(state.hasStarted){roundEl.textContent=state.round;roundMaxEl.textContent=state.maxRounds;turnTitleEl.textContent=`${current()?.name||'玩家'} 的回合`;workersLeftEl.textContent=workersLeft();startPlayerEl.textContent=state.players[state.startPlayerIndex]?.name||'-';harvestRoundsEl.textContent=state.harvest.join(', ')}playersEl.innerHTML=state.players.map(playerHtml).join('');renderActions();renderScore();logEl.innerHTML=state.log.slice(-22).reverse().map(x=>`<li>${escape(x)}</li>`).join('')}
function showModal(t,b){modalTitle.textContent=t;modalBody.innerHTML=b;modal.classList.add('show')}modalClose.onclick=()=>modal.classList.remove('show');
function exportSave(){let code=btoa(unescape(encodeURIComponent(JSON.stringify(state))));showModal('匯出存檔',`<p>複製以下存檔碼：</p><textarea rows="7" readonly>${code}</textarea>`)}function importSave(){let code=prompt('貼上存檔碼');if(!code)return;try{state=JSON.parse(decodeURIComponent(escape(atob(code))));save();render();alert('已匯入')}catch(e){alert('存檔碼無效')}}
function newGame(force=false){if(!force&&!confirm('確定要開始新遊戲？目前進度會被清除。'))return;localStorage.removeItem('farmlinkV28');state=fresh();createNameFields();save();render()}function save(){localStorage.setItem('farmlinkV28',JSON.stringify(state))}function load(){try{return JSON.parse(localStorage.getItem('farmlinkV28'))}catch{return null}}function escape(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
playerCountEl.addEventListener('change',createNameFields);startBtn.onclick=startGame;newGameBtn.onclick=()=>newGame(false);restartBtn.onclick=()=>newGame(true);exportBtn.onclick=exportSave;importBtn.onclick=importSave;createNameFields();render();
</script>
</body>
